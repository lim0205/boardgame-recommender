[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardgame-recommender-course"
version = "0.1.0"
description = "Reproducible board-game recommendation coursework framework"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
boardrec = "boardrec.cli:main"

[tool.setuptools.packages.find]
include = ["boardrec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
